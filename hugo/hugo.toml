baseURL = "https://chroniqueboursiere.fr/"
defaultContentLanguage = "fr"
title = "Chronique Boursière"

[params]
  description = "Média indépendant spécialisé en économie et actualité des entreprises. Décryptez le monde économique."

[taxonomies]
  category = "categories"
  tag = "tags"

[menu]
  [[menu.main]]
    name = "Accueil"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 2
  [[menu.main]]
    name = "Qui sommes-nous"
    url = "/qui-sommes-nous/"
    weight = 3
  [[menu.main]]
    name = "Liens"
    url = "/link/"
    weight = 4

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[pagination]
  pagerSize = 10

[sitemap]
  changeFreq = "weekly"
  priority = 0.5
