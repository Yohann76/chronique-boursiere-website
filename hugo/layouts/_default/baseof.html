<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "fr" }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body class="{{ if .IsHome }}page-home{{ end }}{{ if eq .Layout "link" }} page-link-layout{{ end }}">
  {{- partial "header.html" . -}}
  <main id="main">
    {{- block "main" . }}{{- end }}
  </main>
  {{- partial "footer.html" . -}}
  <script src="/js/main.js"></script>
</body>
</html>
