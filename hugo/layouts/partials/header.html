<header class="site-header" id="site-header">
  <div class="header-inner">
    <a href="/" class="logo" aria-label="Chronique Boursière — Accueil">
      <span class="logo-text">Chronique <em>Boursière</em></span>
    </a>

    <nav class="main-nav" id="main-nav" aria-label="Navigation principale">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}"
        {{- if or (eq $.RelPermalink .URL) (and (ne .URL "/") (hasPrefix $.RelPermalink .URL)) }} class="active"{{ end }}>
        {{ .Name }}
      </a>
      {{ end }}
    </nav>

    <button class="nav-toggle" id="nav-toggle" aria-label="Ouvrir le menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
